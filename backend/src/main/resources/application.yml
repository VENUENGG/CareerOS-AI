spring:
  application:
    name: careeros-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/careeros_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: TRACE

jwt:
  secret: 7d3f2b0e6a8c1f5d9e4b7a2c8f1e6d3a9b5c7e1f4d8a2b6c9e3f7a1b5d8c2e6
  access-token-expiration: 900000
  refresh-token-expiration: 604800000